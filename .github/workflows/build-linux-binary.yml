name: Build Linux Binary

on:
  push:
    branches:
      - fix/artist-popular-without-shared-quota
  workflow_dispatch:

jobs:
  build:
    name: Build spotifast for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev

      - name: Build release binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifast-patched-linux
          path: target/x86_64-unknown-linux-gnu/release/spotifast
          if-no-files-found: error
